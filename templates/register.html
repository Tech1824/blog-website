<!doctype>
<head>
    <title>Register page</title>
<meta name=="viewport" content="width=device-width,initial-scale=1.0">
<style> 
.auth-body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:white;

.auth-box{
     width:400px;
     background: #E8E2D8;
     padding:35px;
     border-radius:12px;
     border:1px solid rgb(225, 219, 248);
     box-shadow:0 10px 25px rgba(0,0,0,.2);
}
.auth-box h2{
    text-align:center;
    margin-bottom: 20px ;
}
.auth-box input{
        width:100%;
        padding:12px;
        margin-bottom:15px;
        border:1px solid #ebe3ed;
        border-radius:6px;
}

.auth-box input:focus{
    border: 3px solid #30253f;
    outline:none;
}
.auth-box label{
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
    width:100%;
}
.auth-box button{
    width:100%;
    padding:15px;
    border: 0.5px solid white;
    border-radius:4px;
    box-sizing:border-box;
    margin-bottom:5px;
    background: #A18D6D;
    color: #EFE9E3;
    cursor: pointer;
}
.auth-box button:hover{
    background: #E1D0B3;
}
</style>

</head>
<body class="auth-body" >
   <div class ="auth-box">
      <h2 > Sign Up</h2><br>
      <form method="POST" action="/register">
            <label>Username:</label><br>
            <input type="text" 
                    name="Username" 
                    placeholder="Username"><br>
            <label>Email:</label> <br>       
            <input type ="Email"
                    name ="Email"
                    placeholder="Email"><br>
            <label>Password:</label><br>  
            <input type ="Password"
                    name="Password"
                    placeholder="Password"><br>
            <label>Confirm Password:</label><br>
            <input type ="Password"
                    name="confirm_password"
                    placeholder="Password"><br>
            
            <button type="submit">sign up</button><br>
            </a>
            <p>Already have an account!<a href='/login'> Sign In</a></p>
           {%if error%}    
           <p>Try Again!</p> 
            {%endif%}
       </form>          
   </div>
    
    
</body>
</html>
