<!doctype>
<html>
    <head>
        <title>OTP verification</title>
        <meta name=="viewport" content="width=device-width,initial-scale=1.0">
         <style>
            .auth-body{
                  height:100vh;
                  display:flex;
                  justify-content:center;
                  align-items:center;
                  background:linear-gradient(135deg,#d0c7d2,#9c8f9f,#bba6c0);
            }

            .auth-box{
                  width:400px;
                  background:#8c7b92;
                  padding:35px;
                  border-radius:12px;
                  border:1px solid rgb(228, 207, 228);
                  box-shadow:0 10px 25px rgba(0,0,0,.2);
            }
            .auth-box h2{
                  text-align:center;
                  margin-bottom: 20px ;
            }
            .auth-box input{
                    width:100%;
                    padding:12px;
                    margin-bottom:15px;
                    border:1px solid #99879e;
                    border-radius:6px;
            }

            .auth-box input:focus{
                     border: 3px solid #4f3c3d;
                     outline:none;
            }
            .auth-box label{
                     font-family: Arial, Helvetica, sans-serif;
                     font-size: 14px;
                     width:100%;
            }
            .auth-box button{
                     width:100%;
                     padding:15px;
                     border: 0.5px solid white;
                     border-radius:4px;
                     box-sizing:border-box;
                     margin-bottom:5px;
                     background:#221637;
                     color:aliceblue;
                     cursor: pointer;
            }
            .auth-box button:hover{
                background:#221637;
            }
         </style>
    </head>
    <body class= "auth-body">
        <div class="auth-box">
           <h2>Verify OTP</h2>
           <p>A 6 digit OTP code have been sent to your registered email address !</p>
            <form method='POST',action='/verify-otp'>
               <label>Enter OTP:</label>
               <input type="text"
                      name="otp"
                      placeholder="Enter 6 digit code">
                     <p>OTP valid for 5 minutes!</p>
                <button type="submit" >Verify OTP
                </button>
                <button type = "submit">Resend OTP
                </button>
            </form>
        </div>    
    </body>
</html>
